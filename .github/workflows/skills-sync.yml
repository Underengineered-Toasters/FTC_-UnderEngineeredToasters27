name: Sync agent skills

# Keeps the upstream-managed engineering skills in .agents/skills/ current with
# mattpocock/skills. Repo-local skills (robot-wifi-setup) are never touched.
# Opens (or refreshes) a PR when upstream has moved; does nothing when it has not.

on:
  schedule:
    - cron: '0 16 * * 1'   # Mondays 16:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync skills from upstream
        id: sync
        run: |
          set -o pipefail
          chmod +x scripts/sync-agent-skills.sh
          result="$(scripts/sync-agent-skills.sh | tail -1)"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "sync result: $result"

      - name: Open or refresh the sync pull request
        if: steps.sync.outputs.result == 'changed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B skills-sync
          git add .agents/skills skills-lock.json
          git diff --cached --quiet && { echo "nothing staged"; exit 0; }
          git commit -m "Sync engineering skills with mattpocock/skills"
          git push -f origin skills-sync

          body=$(cat <<'EOF'
          ## TL;DR
          - Automated sync of the upstream-managed engineering skills in `.agents/skills/` with
            [`mattpocock/skills`](https://github.com/mattpocock/skills).

          ### Summary
          - Regenerated by `scripts/sync-agent-skills.sh` (also runnable locally).
          - Repo-local skills (`robot-wifi-setup`) are not managed and were not touched.
          - `skills-lock.json` hashes recomputed for the managed set.

          ### Evidence / Verification
          - [x] `scripts/sync-agent-skills.sh` reported `changed` (that is why this PR exists).
          - [ ] Not yet reviewed by a human.

          ### Merge Risk Assessment
          - **Risk Level:** Low. Skill markdown and a lock file; nothing in the Android build reads `.agents/`.
          - **Rollback Plan:** Revert this PR.

          ### Merge Gate
          - [ ] Acceptance recorded (GitHub `APPROVED` from @APandit1-cpu, or explicit Chris/Aarush confirmation)
          - [ ] Tested on the actual robot — not applicable (no robot behaviour in this change)
          EOF
          )

          # NOTE: `gh pr edit --body` fails on this repo (Projects-classic GraphQL deprecation), so the
          # body is updated over REST.
          number=$(gh pr list --head skills-sync --state open --json number -q '.[0].number')
          if [ -n "$number" ]; then
            printf '%s\n' "$body" > /tmp/skills-sync-body.md
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$number" -F body=@/tmp/skills-sync-body.md >/dev/null
            echo "refreshed PR #$number for branch skills-sync"
          else
            gh pr create --draft --base master --head skills-sync \
              --title "Sync engineering skills with mattpocock/skills" --body "$body"
          fi
