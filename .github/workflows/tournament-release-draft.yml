name: Draft Tournament Release

on:
  push:
    branches: [main]
    paths:
      - 'TeamCode/**'
      - 'FtcRobotController/**'
      - '*.gradle*'
      - 'gradle/**'

permissions:
  contents: write

jobs:
  draft-release:
    name: Build & Draft Tournament Release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required SDK platform
        run: sdkmanager --install "platforms;android-30"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Determine version and date tag
        id: meta
        run: |
          version=$(grep -oP 'android:versionName="\K[^"]+' FtcRobotController/src/main/AndroidManifest.xml | head -1)
          date_tag=$(date +'%Y.%m.%d-%H%M')
          echo "version=${version:-1.0}" >> $GITHUB_OUTPUT
          echo "tag=v${date_tag}" >> $GITHUB_OUTPUT

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}"             --target main             --draft             --title "Tournament Build ${{ steps.meta.outputs.tag }} (v${{ steps.meta.outputs.version }})"             --generate-notes             TeamCode/build/outputs/apk/release/*.apk             FtcRobotController/build/outputs/apk/release/*.apk
