name: Android CI

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'TeamCode/**'
      - 'FtcRobotController/**'
      - '*.gradle*'
      - 'gradle/**'
      - '.github/workflows/android-ci.yml'
  push:
    branches: [main, dev]
    paths:
      - 'TeamCode/**'
      - 'FtcRobotController/**'
      - '*.gradle*'
      - 'gradle/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build robot app
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required SDK platform
        run: sdkmanager --install "platforms;android-30"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload debug APKs
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            TeamCode/build/outputs/apk/debug/*.apk
            FtcRobotController/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Add build summary
        run: |
          echo "### Robot App Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Branch / Ref: `${{ github.ref_name }}`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: `${{ github.sha }}`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: Tests and APK build passed." >> $GITHUB_STEP_SUMMARY
          echo "Artifact uploads are best-effort; check the upload step for APK availability." >> $GITHUB_STEP_SUMMARY

      - name: Upload build reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          retention-days: 3
          if-no-files-found: ignore
